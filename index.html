<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sən kimsən?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: #16213e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 30px;
            color: #4ecca3;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #0f3460;
            color: white;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #e94560;
            transform: translateY(-3px);
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
            min-height: 30px;
            padding: 15px;
            border-radius: 10px;
            display: none; /* Başlanğıcda gizli */
        }

        /* Nəticə rəngləri */
        .result-box {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 5px solid #e94560;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sən kimsən?</h1>
        
        <div class="button-grid">
            <button onclick="checkUser('Murad')">Murad</button>
            <button onclick="checkUser('Elman')">Elman</button>
            <button onclick="checkUser('İsmayıl')">İsmayıl</button>
            <button onclick="checkUser('Kənan')">Kənan</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function checkUser(name) {
            const resultDiv = document.getElementById('result');
            let message = "";

            if (name === 'Murad') {
                message = "Sən əsəbisən! 😡";
            } else if (name === 'Elman') {
                message = "Sən ikiüzlüsən! 🎭";
            } else if (name === 'İsmayıl') {
                message = "Sən ramkasan! 🖼️";
            } else if (name === 'Kənan') {
                message = "Sən BOMBASAN! 💣🔥";
            }

            resultDiv.innerHTML = message;
            resultDiv.style.display = "block";
            resultDiv.className = "result-box";
            
            // Bombasan seçiləndə balaca bir effekt
            if(name === 'Kənan') {
                resultDiv.style.borderColor = "#4ecca3";
                resultDiv.style.color = "#4ecca3";
            } else {
                resultDiv.style.borderColor = "#e94560";
                resultDiv.style.color = "white";
            }
        }
    </script>

</body>
</html>
